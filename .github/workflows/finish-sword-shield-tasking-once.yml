name: Finalize Sword and Shield tasking (one time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/finish-sword-shield-tasking-once.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install python-docx==1.2.0 lxml==5.4.0
      - name: Apply two approved Commissioner edits, preserving all other content
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from zipfile import ZipFile
          from lxml import etree
          from docx import Document
          import hashlib,os
          filename='Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx'
          path=Path(filename)
          edits=[
              ('The Shield seeks to assess how AI-driven political parties affect citizen engagement, election integrity, and EU democratic institutions.',
               'The Shield has tasked the Sword with assessing how AI-driven political parties affect citizen engagement, election integrity, and EU democratic institutions.'),
              ('The Shield will also have to determine whether current EU rules cover these activities and, where they do not, what it should examine.',
               'The Sword will also have to determine whether current EU rules cover these activities and, where they do not, what it should examine.')
          ]
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with ZipFile(path,'r') as incoming:
              members=incoming.infolist()
              original={f.filename:incoming.read(f.filename) for f in members}
          docxml='word/document.xml'
          root=etree.fromstring(original[docxml])
          paragraphs=root.xpath('./w:body//w:p',namespaces=ns)
          def nodes(p):return p.xpath('.//w:t',namespaces=ns)
          def ptext(p):return ''.join(t.text or '' for t in nodes(p))
          before=[ptext(p) for p in paragraphs]
          for old,new in edits:
              matched=[p for p in paragraphs if old in ptext(p)]
              assert len(matched)==1,('expected precisely one original sentence',old,len(matched))
              p=matched[0];whole=ptext(p)
              assert whole.count(old)==1
              left=whole.index(old);right=left+len(old);offset=0
              for t in nodes(p):
                  v=t.text or '';start=offset;end=start+len(v);offset=end
                  if end<=left or start>=right:continue
                  if start<=left<end:
                      t.text=v[:left-start]+new+(v[right-start:] if right<end else '')
                  else:
                      t.text=v[right-start:] if right<end else ''
                  if t.text and (t.text[0]==' ' or t.text[-1]==' '):
                      t.set('{http://www.w3.org/XML/1998/namespace}space','preserve')
              assert ptext(p)==whole.replace(old,new),'paragraph content mismatch'
          after=[ptext(p) for p in paragraphs]
          expected=[s.replace(edits[0][0],edits[0][1]).replace(edits[1][0],edits[1][1]) for s in before]
          assert after==expected,'Unexpected body text change'
          xml=etree.tostring(root,xml_declaration=True,encoding='UTF-8',standalone=True)
          with NamedTemporaryFile(dir='.',suffix='.docx',delete=False) as f:
              temp=Path(f.name)
          try:
              with ZipFile(temp,'w') as destination:
                  for member in members:
                      destination.writestr(member,xml if member.filename==docxml else original[member.filename])
              with ZipFile(temp,'r') as confirm:
                  assert confirm.testzip() is None
                  assert set(confirm.namelist())==set(original)
                  for key,value in original.items():
                      if key!=docxml:assert confirm.read(key)==value,('unapproved modified component',key)
              verified=Document(temp)
              assert len(verified.inline_shapes)==1,'Screenshot figure has not been preserved'
              assert [p.text for p in verified.paragraphs]==after
              for old,new in edits:
                  assert sum(new in p.text for p in verified.paragraphs)==1
                  assert not any(old in p.text for p in verified.paragraphs)
              os.replace(temp,path)
          finally:
              temp.unlink(missing_ok=True)
          manifest=Path('SHA256SUMS.txt')
          rows=manifest.read_text().splitlines()
          matches=[i for i,s in enumerate(rows) if s.endswith('  '+filename)]
          assert len(matches)==1,'Missing or duplicate DOCX checksum'
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          rows[matches[0]]=digest+'  '+filename
          manifest.write_text('\n'.join(rows)+'\n')
          print('SWORD_SHIELD_QA two_changes=2, other_body_text_unchanged=true, embedded_figure=1, other_docx_parts_unchanged=true, sha256='+digest)
          PY
      - name: Verify source register and file hashes
        run: python scripts/verify_registry.py
      - name: Commit updated manuscript and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finish-sword-shield-tasking-once.yml
          git add Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx SHA256SUMS.txt
          git commit -m 'Clarify Sword and Shield agency in Commissioner tasking'
          git push
