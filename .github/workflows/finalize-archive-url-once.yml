name: Finalize manuscript archive URL (one time)
on:
  push:
    paths:
      - .github/workflows/finalize-archive-url-once.yml
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Replace source-edition address without changing manuscript layout
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tempfile import NamedTemporaryFile
          import hashlib, os
          filename = 'Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx'
          path = Path(filename)
          old = b'https://github.com/ComputerLars/intelligence-assessment-first-term-of-the-synthetic-party'
          new = b'https://computerlars.github.io/intelligence-assessment-first-term-of-the-synthetic-party/'
          with NamedTemporaryFile(prefix='citation-', suffix='.docx', dir='.', delete=False) as tmp:
              temp = Path(tmp.name)
          try:
              with ZipFile(path, 'r') as before, ZipFile(temp, 'w') as after:
                  xml = before.read('word/document.xml')
                  assert xml.count(old) == 1, 'Expected exactly one manuscript source citation'
                  for item in before.infolist():
                      b = before.read(item.filename)
                      if item.filename == 'word/document.xml':
                          b = b.replace(old, new)
                      after.writestr(item, b)
              with ZipFile(temp, 'r') as check:
                  word_xml = check.read('word/document.xml')
                  assert old not in word_xml and word_xml.count(new) == 1
              os.replace(temp, path)
          finally:
              temp.unlink(missing_ok=True)
          manifest = Path('SHA256SUMS.txt')
          lines = manifest.read_text().splitlines()
          hits = [i for i,s in enumerate(lines) if s.endswith('  '+filename)]
          assert len(hits) == 1, 'Exactly one manuscript SHA entry required'
          lines[hits[0]] = hashlib.sha256(path.read_bytes()).hexdigest() + '  ' + filename
          manifest.write_text('\n'.join(lines) + '\n')
          print('Citation updated. New SHA-256:', hashlib.sha256(path.read_bytes()).hexdigest())
          PY
      - name: Commit updated manuscript and checksum
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx SHA256SUMS.txt
          git commit -m 'Point manuscript source citation to public terminal archive'
          git push
