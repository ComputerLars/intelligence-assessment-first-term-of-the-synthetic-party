name: Clarify and highlight proposed edited-volume references (one time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/mark-proposed-volume-refs-once.yml
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==5.4.0 python-docx==1.2.0
      - name: Update only the two bibliography entries with yellow highlights
        run: |
          python - <<'PY'
          from copy import deepcopy
          from pathlib import Path
          from tempfile import NamedTemporaryFile
          from zipfile import ZipFile
          from lxml import etree
          from docx import Document
          from docx.enum.text import WD_COLOR_INDEX
          import hashlib,os
          path=Path("Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx")
          volume="Political Parties and Digital Innovations: Participation, Democracy and Efficiency"
          after_tail=" (working title), edited by Fabio G. Lupato, Oscar Barberà, Valeria Tarditi and Marco Meloni. Book proposal for Palgrave Macmillan."
          initial=[
            ('Lupato, Fabio G. and Marco Meloni. This volume. “What is Party Innovation? Definition, types, and implications of innovation in political parties.” In ',
             'Lupato, Fabio G. and Marco Meloni. This volume. “What is Party Innovation? Definition, types, and implications of innovation in political parties.” '),
            ('Tarditi, Valeria and Francesco Raniolo. This volume. “Changes, Innovations and Organisational Dilemmas in the Digital Era: What Party Form?” In ',
             'Tarditi, Valeria and Francesco Raniolo. This volume. “Changes, Innovations and Organisational Dilemmas in the Digital Era: What Party Form?” ')
          ]
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          W='{http://schemas.openxmlformats.org/wordprocessingml/2006/main}'
          X='{http://www.w3.org/XML/1998/namespace}'
          with ZipFile(path,'r') as source:
            infos=source.infolist()
            original={info.filename:source.read(info.filename) for info in infos}
          docpart='word/document.xml'
          xml=etree.fromstring(original[docpart])
          ps=xml.xpath('./w:body//w:p',namespaces=ns)
          def ptext(p):return ''.join(t.text or '' for t in p.xpath('.//w:t',namespaces=ns))
          before=[ptext(p) for p in ps]
          expected=before[:]
          for oldhead,newhead in initial:
            old=oldhead+volume+'. Cham: Palgrave Macmillan.'
            new=newhead+'Chapter prepared for '+volume+after_tail
            matched=[(i,p) for i,p in enumerate(ps) if ptext(p)==old]
            assert len(matched)==1,('Reference entry mismatch',oldhead, len(matched))
            i,p=matched[0]
            runs=p.xpath('./w:r',namespaces=ns)
            assert len(runs)==3,('Unexpected bibliography run layout',i,len(runs))
            texts=[]
            for r in runs:
              ts=r.xpath('./w:t',namespaces=ns)
              assert len(ts)==1,('Unexpected text-node layout',i)
              texts.append(ts[0])
            assert texts[0].text==oldhead
            assert texts[1].text==volume
            assert texts[2].text=='. Cham: Palgrave Macmillan.'
            assert runs[1].xpath('./w:rPr/w:i',namespaces=ns),('Book title not italic',i)
            # Preserve original paragraph attributes and the original author/title and italic book title runs.
            texts[0].text=newhead
            # Insert yellow 'Chapter prepared for ' between original author/title and book title.
            insert=deepcopy(runs[0])
            for child in list(insert):
              if child.tag!=W+'rPr':insert.remove(child)
            node=etree.SubElement(insert,W+'t')
            node.text='Chapter prepared for '
            node.set(X+'space','preserve')
            rpr=insert.find(W+'rPr')
            if rpr is None:rpr=etree.Element(W+'rPr');insert.insert(0,rpr)
            highlight=rpr.find(W+'highlight')
            if highlight is None:highlight=etree.SubElement(rpr,W+'highlight')
            highlight.set(W+'val','yellow')
            p.insert(p.index(runs[1]),insert)
            # Replace only suffix after italic title; mark it yellow.
            texts[2].text=after_tail
            texts[2].set(X+'space','preserve')
            rpr=runs[2].find(W+'rPr')
            if rpr is None:rpr=etree.Element(W+'rPr');runs[2].insert(0,rpr)
            highlight=rpr.find(W+'highlight')
            if highlight is None:highlight=etree.SubElement(rpr,W+'highlight')
            highlight.set(W+'val','yellow')
            assert ptext(p)==new,(ptext(p),new)
            expected[i]=new
            print('BIB_ENTRY_UPDATED',i,new)
          after=[ptext(p) for p in ps]
          assert after==expected,'Change outside the two approved reference paragraphs'
          output=etree.tostring(xml,xml_declaration=True,encoding='UTF-8',standalone=True)
          with NamedTemporaryFile(dir='.',suffix='.docx',delete=False) as tf:
            temp=Path(tf.name)
          try:
            with ZipFile(temp,'w') as dest:
              for info in infos:
                dest.writestr(info, output if info.filename==docpart else original[info.filename])
            with ZipFile(temp) as verify:
              assert verify.testzip() is None,'ZIP integrity error'
              assert set(verify.namelist())==set(original)
              for name,raw in original.items():
                if name!=docpart:
                  assert verify.read(name)==raw,('Unapproved DOCX part changed',name)
            checked=Document(temp)
            assert len(checked.inline_shapes)==1,'Figure missing'
            checkedparas=[p.text for p in checked.paragraphs]
            assert checkedparas==expected
            for oldhead,newhead in initial:
              found=[p for p in checked.paragraphs if p.text.startswith(newhead)]
              assert len(found)==1
              p=found[0]
              assert p.text==newhead+'Chapter prepared for '+volume+after_tail
              assert len(p.runs)==4
              assert p.runs[1].text=='Chapter prepared for ' and p.runs[1].font.highlight_color==WD_COLOR_INDEX.YELLOW
              assert p.runs[2].text==volume and p.runs[2].italic is True
              assert p.runs[3].text==after_tail and p.runs[3].font.highlight_color==WD_COLOR_INDEX.YELLOW
            os.replace(temp,path)
          finally:
            temp.unlink(missing_ok=True)
          manifest=Path('SHA256SUMS.txt')
          lines=manifest.read_text().splitlines()
          indices=[i for i,line in enumerate(lines) if line.endswith('  '+path.name)]
          assert len(indices)==1
          digest=hashlib.sha256(path.read_bytes()).hexdigest()
          lines[indices[0]]=digest+'  '+path.name
          manifest.write_text('\n'.join(lines)+'\n')
          print('DOCUMENT_QA','2 references revised; changed wording yellow; original titles italic; body/footnotes/media unchanged; sha256='+digest)
          PY
      - name: Verify registry and hashes
        run: python scripts/verify_registry.py
      - name: Commit updated Word file and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/mark-proposed-volume-refs-once.yml
          git add Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx SHA256SUMS.txt
          git commit -m 'Identify proposed Palgrave volume in two highlighted references'
          git push
