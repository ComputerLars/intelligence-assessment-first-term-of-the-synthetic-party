name: Publish source registry
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install markdown-it-py==3.0.0
      - run: python scripts/verify_registry.py
      - run: python scripts/build_pages.py "$RUNNER_TEMP/registry-site"
      - run: node scripts/verify_pages.cjs "$RUNNER_TEMP/registry-site"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/registry-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
