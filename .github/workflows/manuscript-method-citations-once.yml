name: Integrate manuscript edits and compact citations (one time)
on:
  push:
    branches: [main]
    paths: [.github/workflows/manuscript-method-citations-once.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==5.4.0 python-docx==1.2.0
      - name: Apply exact changes and verify Word package integrity
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tempfile import NamedTemporaryFile
          from copy import deepcopy
          from lxml import etree
          from docx import Document
          import hashlib,os,json
          filename='Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx'
          path=Path(filename);w='http://schemas.openxmlformats.org/wordprocessingml/2006/main'
          q=lambda x:'{'+w+'}'+x
          ns={'w':w}
          with ZipFile(path) as oldzip:
              info=oldzip.infolist()
              contents={i.filename:oldzip.read(i.filename) for i in info}
          root=etree.fromstring(contents['word/document.xml'])
          ps=root.xpath('./w:body//w:p',namespaces=ns)
          def nodes(p):return p.xpath('.//w:t',namespaces=ns)
          def txt(p):return ''.join(t.text or '' for t in nodes(p))
          baseline=[txt(p) for p in ps]
          edits=[]
          def replace(start,old,new):
              hits=[p for p in ps if txt(p).startswith(start) and old in txt(p)]
              assert len(hits)==1,(start,old[:40],len(hits))
              p=hits[0];full=txt(p);assert full.count(old)==1
              lo=full.index(old);hi=lo+len(old);offset=0
              for t in nodes(p):
                  s=t.text or '';a=offset;b=a+len(s);offset=b
                  if b<=lo or a>=hi:continue
                  if a<=lo<b:t.text=s[:lo-a]+new+(s[hi-a:] if hi<b else '')
                  else:t.text=s[hi-a:] if hi<b else ''
                  if t.text and (t.text[0]==' ' or t.text[-1]==' '):t.set('{http://www.w3.org/XML/1998/namespace}space','preserve')
              assert txt(p)==full.replace(old,new)
              edits.append((start,old,new))
          replace('By employing genre fiction','By employing genre fiction as a methodology to investigate the party’s archive, I analyse The Synthetic Party’s specificity as an immanent critique of party form.','By employing genre fiction to stage a speculative bureaucracy in the present (cf. Austin and Leander 2025, whose European policy fiction is set in 2050), I investigate how The Synthetic Party’s own operations fabulate an immanent critique of democratic innovation.')
          replace('By employing genre fiction','The EEAS proposes to ','The real EEAS recently proposed to ')
          replace('The inquiry is structured around four specialist AI agents','The agent-to-agent exchanges are fictitious, not records of an AI simulation, although I myself employed local AI agents to retrieve, organise and navigate the material.','The agent-to-agent exchanges are fictitious, not records of an autonomous AI simulation, although I myself employed local AI agents to retrieve, organise and navigate the material (cf. Berg and Pink 2026 on AI participation in speculative ethnography).')
          replace('Silvija Vuković then tracked',
            'Silvija Vuković then tracked Leader Lars across three successive analyses of chatbot politicians. In her first piece (Vuković 2022), published in December 2022, shortly after her own interview with Leader Lars on Discord, she examined how the AI politician presents itself as calm, rational, and always available to the people, and termed this a potential "next level" of populism. In her second ECPR piece (Vuković 2024), she argued that the chatbot politician creates the sense of a private, one-to-one chat and of completely neutral AI calculation, thus placing the people against corrupt human politicians, with human programmers effectively behind the scenes. In her third article (Vuković 2025), she warns that this technopopulist appeal could very easily slip into illiberalism if the electorate comes to prefer an unaccountable AI to the democratic process of disagreement.',
            'Silvija Vuković followed Leader Lars across three analyses of chatbot politicians. After interviewing him on Discord, she described the AI politician’s calm, rational availability to the people as a potential "next level" of populism (Vuković 2022). In her second ECPR piece, she argued that chatbot politicians create the sense of a private, one-to-one chat and of completely neutral AI calculation, placing the people against corrupt human politicians while human programmers remain behind the scenes (Vuković 2024). In her third, she warned that this technopopulist appeal could slip into illiberalism if the electorate came to prefer an unaccountable AI to the democratic process of disagreement (Vuković 2025).')
          replace('With AI-powered parties',' Prior to the publication of the first comparative study of ten synthetic political actors by Michal Malý, Giulia Sandri, and Oscar Barberà, I had already engaged with seven of these actors at the Synthetic Summit I organised in Aarhus, which informed the identification of those seven cases in the study (Malý et al. 2026; A27).','')
          replace('With AI-powered parties','In The Synthetic Party, AI is not just a tool but acts as a leader or representative, generating statements that may become party policy. In contrast, digital parties use internet platforms and tools','As The Synthetic Party’s public representative, Leader Lars generates statements that may become party policy. Digital parties, by contrast, use internet platforms and tools')
          replace('The Shield seeks to assess','(Go and Kim 2025; Go 2025, §III.2)','(Go and Kim 2025)')
          replace('European Parliament and Council. 2018.','European Parliament and Council. 2018. Regulation (EU) 2018/1725 of 23 October 2018 on the protection of natural persons with regard to the processing of personal data by the Union institutions, bodies, offices and agencies and on the free movement of such data, and repealing Regulation (EC) No 45/2001 and Decision No 1247/2002/EC. https://eur-lex.europa.eu/eli/reg/2018/1725/oj/eng.','European Parliament and Council. 2018. Regulation (EU) 2018/1725 of 23 October 2018 (data protection by EU institutions and bodies). https://eur-lex.europa.eu/eli/reg/2018/1725/oj/eng.')
          replace('———. 2026. Regulation (EU) 2026/1744','———. 2026. Regulation (EU) 2026/1744 of 8 July 2026 amending Regulations (EU) 2024/1689, (EU) 2018/1139 and (EU) 2023/1230 as regards the simplification of the implementation of harmonised rules on artificial intelligence (Digital Omnibus on AI). OJ L, 2026/1744, 24 July. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32026R1744.','———. 2026. Regulation (EU) 2026/1744 of 8 July 2026 (Digital Omnibus on AI). OJ L, 2026/1744, 24 July. https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX%3A32026R1744.')
          expected=baseline[:]
          for start,old,new in edits:
              ids=[i for i,s in enumerate(expected) if s.startswith(start) and old in s]
              assert len(ids)==1,(start,ids)
              expected[ids[0]]=expected[ids[0]].replace(old,new)
          assert [txt(p) for p in ps]==expected
          assert len(edits)==9
          go=[p for p in ps if txt(p).startswith('Go, Seon Gyu. 2025. “Modelling AI political party: Operating system for better democracy.”')]
          assert len(go)==1
          go[0].getparent().remove(go[0])
          def add_before(prefix,parts):
              hits=[p for p in ps if txt(p).startswith(prefix)]
              assert len(hits)==1
              parent=hits[0];p=etree.Element(q('p'))
              pp=parent.find(q('pPr'))
              if pp is not None:p.append(deepcopy(pp))
              base=parent.find(q('r'))
              rpr=base.find(q('rPr')) if base is not None else None
              for value,italic in parts:
                  r=etree.SubElement(p,q('r'))
                  if rpr is not None:r.append(deepcopy(rpr))
                  if italic:
                      prop=r.find(q('rPr'))
                      if prop is None:prop=etree.Element(q('rPr'));r.insert(0,prop)
                      x=prop.find(q('i'))
                      if x is None:x=etree.SubElement(prop,q('i'))
                      x.set(q('val'),'1')
                  t=etree.SubElement(r,q('t'));t.text=value
                  if value[0]==' ' or value[-1]==' ':t.set('{http://www.w3.org/XML/1998/namespace}space','preserve')
              parent.addprevious(p)
              return txt(p)
          a=add_before('Bendyk, Edwin. 2022.',[
             ('Austin, Jonathan Luke and Anna Leander. 2025. “The Future of Academic Expertise: Speculative European Bureaucratic Fabulations.” In ',False),
             ('Knowledge and Expertise in International Politics: A Handbook',True),
             (', ed. Berit Bliesemann de Guevara et al., 954–967. Oxford: Oxford University Press. https://doi.org/10.1093/oso/9780192871145.003.0062.',False)])
          b=add_before('Bickerton, Christopher J. and Carlo Invernizzi Accetti. 2021.',[
             ('Berg, Martin and Sarah Pink. 2026. “Speculating with Machines: Generative AI in Futures Ethnography.” ',False),
             ('Qualitative Inquiry',True),
             (', advance online publication, 29 March. https://doi.org/10.1177/10778004261434468.',False)])
          newer=etree.tostring(root,encoding='UTF-8',xml_declaration=True,standalone=True)
          with NamedTemporaryFile(dir='.',suffix='.docx',delete=False) as f:tmp=Path(f.name)
          try:
              with ZipFile(tmp,'w') as out:
                  for item in info:out.writestr(item,newer if item.filename=='word/document.xml' else contents[item.filename])
              with ZipFile(tmp) as test:
                  assert set(test.namelist())==set(contents)
                  assert test.testzip() is None
                  for name in contents:
                      if name!='word/document.xml':assert test.read(name)==contents[name],name
              d=Document(tmp)
              ps2=[p.text for p in d.paragraphs]
              assert len(d.inline_shapes)==1
              assert sum(v.startswith('Austin, Jonathan Luke') for v in ps2)==1
              assert sum(v.startswith('Berg, Martin and Sarah Pink') for v in ps2)==1
              assert not any('Go, Seon Gyu. 2025. “Modelling AI political party' in v for v in ps2)
              assert not any('Prior to the publication of the first comparative study' in v for v in ps2)
              assert any('in the present (cf. Austin and Leander 2025' in v for v in ps2)
              assert any('not records of an autonomous AI simulation' in v for v in ps2)
              assert any('the sense of a private, one-to-one chat' in v for v in ps2)
              os.replace(tmp,path)
          finally:
              tmp.unlink(missing_ok=True)
          sums=Path('SHA256SUMS.txt');lines=sums.read_text().splitlines()
          match=[i for i,s in enumerate(lines) if s.endswith('  '+filename)]
          assert len(match)==1
          sha=hashlib.sha256(path.read_bytes()).hexdigest()
          lines[match[0]]=sha+'  '+filename
          sums.write_text('\n'.join(lines)+'\n')
          d=Document(path);P=[p.text for p in d.paragraphs];ri=P.index('References')
          mi=next(i for i,v in enumerate(P) if v.startswith('Methodological Statement:'))
          caption=sum(len(v.split()) for v in P[mi:ri] if v.startswith('Figure 1.'))
          body=sum(len(v.split()) for v in P[mi:ri]);refs=sum(len(v.split()) for v in P[ri+1:])
          print('PUBLICATION_QA '+json.dumps({'sha256':sha,'applied_replacements':len(edits),'body_ex_caption':body-caption,'reference_words':refs,'body_plus_refs':body+refs-caption,'caption':caption,'body_refs_plus_caption':body+refs,'reference_entries':len([v for v in P[ri+1:] if v.strip()]),'image_count':len(d.inline_shapes)},ensure_ascii=False))
          PY
      - name: Verify source edition
        run: python scripts/verify_registry.py
      - name: Commit final manuscript
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/manuscript-method-citations-once.yml
          git add Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx SHA256SUMS.txt
          git commit -m 'Refine speculative method and trim citations in article'
          git push
