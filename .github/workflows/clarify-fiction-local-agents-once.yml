name: Clarify fictional exchanges and local AI research (one time)
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/clarify-fiction-local-agents-once.yml
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install lxml==5.4.0 python-docx==1.2.0
      - name: Apply approved methodological text, preserving all other content
        run: |
          python - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          from tempfile import NamedTemporaryFile
          from lxml import etree
          from docx import Document
          import hashlib,os

          doc=Path('Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx')
          replacements=[
              (
              'The agent-to-agent exchanges are fictitious, not records of an AI simulation.',
              'The agent-to-agent exchanges are fictitious, not records of an AI simulation, although I myself employed local AI agents to retrieve, organise and navigate the material.'
              ),
              (
              'Within the fiction, the agents assemble them into dossiers.',
              'Within the fiction, the agents intercept my stored records to build the case.'
              )
          ]
          ns={'w':'http://schemas.openxmlformats.org/wordprocessingml/2006/main'}
          with ZipFile(doc,'r') as z:
              members=z.infolist()
              original={x.filename:z.read(x.filename) for x in members}
          root=etree.fromstring(original['word/document.xml'])
          paragraphs=root.xpath('./w:body//w:p',namespaces=ns)
          def nodes(p):return p.xpath('.//w:t',namespaces=ns)
          def text(p):return ''.join(n.text or '' for n in nodes(p))
          before=[text(p) for p in paragraphs]

          for old,new in replacements:
              selected=[p for p in paragraphs if old in text(p)]
              assert len(selected)==1,('exact source sentence missing/duplicated',old,len(selected))
              p=selected[0]
              words=nodes(p);original_text=text(p)
              start=original_text.index(old);stop=start+len(old)
              offset=0
              for t in words:
                  value=t.text or '';left=offset;right=left+len(value);offset=right
                  if right<=start or left>=stop:continue
                  if left<=start<right:
                      t.text=value[:start-left]+new+(value[stop-left:] if stop<right else '')
                  else:
                      t.text=value[stop-left:] if stop<right else ''
              assert text(p)==original_text.replace(old,new)
          after=[text(p) for p in paragraphs]
          expected=[p.replace(replacements[0][0],replacements[0][1]).replace(replacements[1][0],replacements[1][1]) for p in before]
          assert after==expected,'Unapproved change to another paragraph'
          new_xml=etree.tostring(root,encoding='UTF-8',xml_declaration=True,standalone=True)
          with NamedTemporaryFile(prefix='method-',suffix='.docx',dir='.',delete=False) as fh:
              temp=Path(fh.name)
          try:
              with ZipFile(temp,'w') as z:
                  for member in members:z.writestr(member,new_xml if member.filename=='word/document.xml' else original[member.filename])
              with ZipFile(temp,'r') as test:
                  assert set(test.namelist())==set(original)
                  for name in original:
                      if name!='word/document.xml':assert test.read(name)==original[name],name
              check=Document(temp)
              assert len(check.inline_shapes)==1,'Existing figure must be preserved'
              for old,new in replacements:
                  assert sum(new in para.text for para in check.paragraphs)==1
                  assert all(old not in para.text for para in check.paragraphs)
              os.replace(temp,doc)
          finally:
              temp.unlink(missing_ok=True)
          manifest=Path('SHA256SUMS.txt')
          lines=manifest.read_text().splitlines()
          index=[i for i,line in enumerate(lines) if line.endswith('  '+doc.name)]
          assert len(index)==1
          digest=hashlib.sha256(doc.read_bytes()).hexdigest()
          lines[index[0]]=digest+'  '+doc.name
          manifest.write_text('\n'.join(lines)+'\n')
          print('Approved text changes: 2; figure retained: 1; other document parts unchanged')
          print('DOCX_SHA256:',digest)
          PY
      - name: Commit final manuscript and remove one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/clarify-fiction-local-agents-once.yml
          git add Intelligence_Assessment_First_Term_Synthetic_Party_v01.docx SHA256SUMS.txt
          git commit -m 'Distinguish fictional agent exchanges from local AI archival research'
          git push
